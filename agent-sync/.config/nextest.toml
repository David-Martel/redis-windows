# cargo-nextest configuration for high-performance test execution
# https://nexte.st/book/configuration

[store]
# Where to store test results
dir = "target/nextest"

[profile.default]
# Default test profile configuration
retries = { backoff = "exponential", count = 2, delay = "1s" }
test-threads = "num-cpus"
threads-required = 1
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "10s"
success-output = "immediate"
failure-output = "immediate"
fail-fast = false

[profile.ci]
# CI-specific profile - fail fast, no retries
retries = 0
fail-fast = true
slow-timeout = { period = "120s", terminate-after = 1 }
test-threads = 4

[profile.dev]
# Development profile - quick feedback
test-threads = "num-cpus"
retries = 0
fail-fast = false
success-output = "never"
failure-output = "immediate"

[profile.stress]
# Stress testing profile - many iterations
test-threads = "num-cpus"
retries = 5
slow-timeout = { period = "300s", terminate-after = 3 }

[profile.quick]
# Quick test run - parallel execution, fail fast
test-threads = "num-cpus"
fail-fast = true
retries = 0
success-output = "never"
failure-output = "final"

# Test groups configuration
[[profile.default.overrides]]
filter = "test(integration)"
test-threads = 2
slow-timeout = { period = "180s" }

[[profile.default.overrides]]
filter = "test(benchmark)"
test-threads = 1
slow-timeout = { period = "300s" }

[[profile.default.overrides]]
filter = "test(redis)"
test-threads = 1
serial-test = true
