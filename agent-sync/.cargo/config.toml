# Cross-compilation configuration for agent-sync
# Supports Windows MSVC, Linux GNU, and WSL targets
#
# NOTE: Profile definitions ([profile.*]) belong in Cargo.toml, not here.
# This file handles build toolchain, environment, targets, and aliases only.

[build]
# Default target for Windows development
target = "x86_64-pc-windows-msvc"
# Route all rustc invocations through sccache for shared compilation caching
rustc-wrapper = "sccache"

# Cross-compilation target rustflags
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=/SUBSYSTEM:CONSOLE",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=gold",
]

[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-static",
]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/SUBSYSTEM:CONSOLE"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=gold"]

# Environment variables
[env]
# sccache requires incremental compilation to be disabled
CARGO_INCREMENTAL = "0"
# Colored terminal output
CARGO_TERM_COLOR = "always"

# Registry configuration
[registry]
default = "crates-io"

[registry.crates-io]
protocol = "sparse"

# Network configuration
[net]
retry = 2
git-fetch-with-cli = true
offline = false

# Cargo command aliases
[alias]
tn = "nextest run"
