# cargo-deny configuration for agent-sync project
# Ensures security, licensing, and supply chain compliance

[graph]
# Enable all dependency targets for comprehensive checking
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-pc-windows-msvc" },
]

# Only consider normal dependencies, not dev dependencies for licensing
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Security vulnerability database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.19+: unmaintained accepts "workspace"|"all"|"transitive"|"none"
unmaintained = "workspace"
ignore = [
    # protobuf 2.28.0 via prometheus 0.13 - prometheus is optional and not used with untrusted input
    { id = "RUSTSEC-2024-0437", reason = "prometheus metrics are internal; no untrusted protobuf parsing" },
    # async-std discontinued (RUSTSEC-2025-0052) - optional dep, not in default features
    { id = "RUSTSEC-2025-0052", reason = "optional dependency, not in default features" },
    # bincode unmaintained (RUSTSEC-2025-0141) - considering migration to postcard
    { id = "RUSTSEC-2025-0141", reason = "considering migration to postcard; optional dep" },
    # bytes integer overflow in BytesMut::reserve (RUSTSEC-2026-0007) - only affects very large allocations
    { id = "RUSTSEC-2026-0007", reason = "agent-sync never reserves extreme buffer sizes" },
]

[licenses]
# cargo-deny 0.19+ license configuration
# High confidence threshold when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "MPL-2.0",
]

exceptions = [
    { allow = ["Unicode-DFS-2016"], crate = "unicode-ident" },
]

[bans]
# Multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Specific crates to ban
deny = [
    # Ban crates with known security issues
    { name = "openssl", version = "<0.10" },
    { name = "chrono", version = "<0.4.20" },

    # Ban deprecated or unmaintained crates
    { name = "tempdir" },
    { name = "net2" },

    # Ban crates that could introduce security vulnerabilities
    { name = "yaml-rust", version = "<0.4.5" },
]

# No allow-list: all crates permitted unless explicitly banned above

# Skip crates that are typically duplicated
skip = [
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_aarch64_msvc" },
]

# Tree skipping for complex dependency trees
skip-tree = []

[sources]
# Define allowed source registries
unknown-registry = "warn"
unknown-git = "warn"

allow-registry = [
    "https://github.com/rust-lang/crates.io-index"
]

allow-git = []